<!DOCTYPE html>
<html lang="en" class="h-full">

    <title>Penalty King - 3D Football Penalty Shootout</title>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arcade: ['Chakra Petch', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            900: '#0a0f1d',
                            800: '#131b2e',
                            700: '#1e2942',
                        },
                        electric: {
                            400: '#38bdf8',
                            500: '#0ea5e9',

                        },
                        neon: {

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;

            box-sizing: border-box;
        }
        body {
            background-color: #0a0f1d;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .btn-glow {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            transition: all 0.2s ease;
        }
        .btn-glow:active {
            transform: scale(0.96);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.6);
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }
        .floating-text {
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 4px); }
            40% { transform: translate(6px, -4px); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(4px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .shake {
            animation: screenShake 0.3s ease-in-out;
        }
    </style>

    <!-- Game Engine & Application Logic -->
    <script>
        /**
         * Audio Manager using Web Audio API
         */
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.initAudio();
            }

            initAudio() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    this.ctx = new AudioContext();
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playKick() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playWhistle() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, now);
                osc.frequency.setValueAtTime(2800, now + 0.1);
                osc.frequency.setValueAtTime(2400, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playPostHit() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playNet() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const now = this.ctx.currentTime;
                // Buffer noise for net flutter
                const bufferSize = this.ctx.sampleRate * 0.2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            playCheer() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.8;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.linearRampToValueAtTime(1200, now + 0.4);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            playSave() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playClick() {
                if (this.muted || !this.ctx) return;
                this.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        /**
         * Storage Manager for High Scores, Stats, and Achievements
         */
        class StorageManager {
            constructor() {
                this.storageKey = 'penalty_king_save_v1';
                this.data = this.load();
            }

            load() {
                try {
                    const saved = localStorage.getItem(this.storageKey);
                    if (saved) return JSON.parse(saved);
                } catch (e) {
                    console.error('LocalStorage error:', e);
                }
                return {
                    highScores: { endless: 0, classic: 0, timeattack: 0 },
                    stats: { totalGoals: 0, totalShots: 0, bestCombo: 1, bestStreak: 0, currentStreak: 0 },
                    achievements: {
                        first_goal: false,
                        hat_trick: false,
                        sharpshooter: false,
                        unstoppable: false,
                        top_bins: false,
                        curve_master: false,
                        ice_cold: false,
                        century: false,
                        legend: false
                    }
                };
            }

            save() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                } catch (e) {
                    console.error('LocalStorage error:', e);
                }
            }

            updateScore(mode, score) {
                if (score > this.data.highScores[mode]) {
                    this.data.highScores[mode] = score;
                    this.save();
                    return true; // New record
                }
                return false;
            }

            recordShot(isGoal, points, combo, isTopBin, isCurve, isPost) {
                this.data.stats.totalShots++;
                if (isGoal) {
                    this.data.stats.totalGoals++;
                    this.data.stats.currentStreak++;
                    if (this.data.stats.currentStreak > this.data.stats.bestStreak) {
                        this.data.stats.bestStreak = this.data.stats.currentStreak;
                    }
                    if (combo > this.data.stats.bestCombo) {
                        this.data.stats.bestCombo = combo;
                    }
                } else {
                    this.data.stats.currentStreak = 0;
                }

                // Check achievements
                const ach = this.data.achievements;
                const newlyUnlocked = [];

                if (isGoal && !ach.first_goal) { ach.first_goal = true; newlyUnlocked.push('First Goal ⚽'); }
                if (this.data.stats.currentStreak >= 3 && !ach.hat_trick) { ach.hat_trick = true; newlyUnlocked.push('Hat Trick 🎩'); }
                if (this.data.stats.currentStreak >= 5 && !ach.sharpshooter) { ach.sharpshooter = true; newlyUnlocked.push('Sharpshooter 🎯'); }
                if (this.data.stats.currentStreak >= 10 && !ach.unstoppable) { ach.unstoppable = true; newlyUnlocked.push('Unstoppable 🔥'); }
                if (isTopBin && !ach.top_bins) { ach.top_bins = true; newlyUnlocked.push('Top Bins ⭐'); }
                if (isCurve && !ach.curve_master) { ach.curve_master = true; newlyUnlocked.push('Curve Master 🌀'); }
                if (this.data.stats.currentStreak >= 20 && !ach.ice_cold) { ach.ice_cold = true; newlyUnlocked.push('Ice Cold 🧊'); }
                if (this.data.stats.totalGoals >= 100 && !ach.century) { ach.century = true; newlyUnlocked.push('Century 💯'); }
                if (this.data.stats.totalGoals >= 500 && !ach.legend) { ach.legend = true; newlyUnlocked.push('Legend 👑'); }

                this.save();
                return newlyUnlocked;
            }
        }

        /**
         * Main Game Engine (Three.js + Physics + Loop)
         */
        class PenaltyKingGame {
            constructor() {
                this.audio = new AudioManager();
                this.storage = new StorageManager();

                this.state = 'MENU'; // MENU, READY, SHOOTING, RESULT, PAUSED, GAMEOVER
                this.mode = 'endless'; // endless, classic, timeattack

                // Gameplay variables
                this.score = 0;
                this.combo = 1;
                this.streak = 0;
                this.lives = 3;
                this.shotsLeft = 5;
                this.timeLeft = 60;
                this.timerInterval = null;

                // Three.js core
                this.container = document.getElementById('canvas-container');
                this.scene = null;
                this.camera = null;
                this.renderer = null;

                // Game objects

            buildStadium() {
                // Pitch Ground
                const pitchGeo = new THREE.PlaneGeometry(35, 55);
                const pitchMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 });
                const pitch = new THREE.Mesh(pitchGeo, pitchMat);
                pitch.rotation.x = -Math.PI / 2;
                pitch.receiveShadow = true;
                this.scene.add(pitch);

                // Pitch Stripes
                for (let i = -20; i < 20; i += 4) {
                    const stripeGeo = new THREE.PlaneGeometry(35, 2);
                    const stripeMat = new THREE.MeshStandardMaterial({ 
                        color: i % 8 === 0 ? 0x16a34a : 0x15803d, 
                        roughness: 0.8 
                    });
                    const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                    stripe.rotation.x = -Math.PI / 2;
                    stripe.position.set(0, 0.001, i);
                    stripe.receiveShadow = true;
                    this.scene.add(stripe);
                }

                // Penalty Spot & Box Markings (White Lines)
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                
                // Penalty Spot
                const spotGeo = new THREE.CircleGeometry(0.12, 16);
                const spot = new THREE.Mesh(spotGeo, lineMat);
                spot.rotation.x = -Math.PI / 2;
                spot.position.set(0, 0.005, 7);
                this.scene.add(spot);

                // Penalty Box Area lines
                const boxGeo = new THREE.PlaneGeometry(12, 6);
                const boxMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.rotation.x = -Math.PI / 2;
                box.position.set(0, 0.002, -9);
                this.scene.add(box);

                // Stadium Atmosphere stands
                const standGeo = new THREE.BoxGeometry(40, 15, 2);
                const standMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
                
                const backStand = new THREE.Mesh(standGeo, standMat);
                backStand.position.set(0, 7.5, -25);
                this.scene.add(backStand);

                const leftStand = new THREE.Mesh(new THREE.BoxGeometry(2, 15, 60), standMat);
                leftStand.position.set(-18, 7.5, 0);
                this.scene.add(leftStand);

                const rightStand = new THREE.Mesh(new THREE.BoxGeometry(2, 15, 60), standMat);
                rightStand.position.set(18, 7.5, 0);
                this.scene.add(rightStand);

            buildGoal() {
                const postRadius = 0.08;
                const postHeight = 2.44;
                const postWidth = 7.32; // Standard goal width

                const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.3 });

                // Left Post
                const leftPostGeo = new THREE.CylinderGeometry(postRadius, postRadius, postHeight, 16);
                const leftPost = new THREE.Mesh(leftPostGeo, postMat);
                leftPost.position.set(-postWidth / 2, postHeight / 2, -12);
                leftPost.castShadow = true;
                this.scene.add(leftPost);

                // Right Post
                const rightPost = new THREE.Mesh(leftPostGeo, postMat);
                rightPost.position.set(postWidth / 2, postHeight / 2, -12);
                rightPost.castShadow = true;
                this.scene.add(rightPost);

                // Crossbar
                const barGeo = new THREE.CylinderGeometry(postRadius, postRadius, postWidth + postRadius * 2, 16);
                const crossbar = new THREE.Mesh(barGeo, postMat);
                crossbar.rotation.z = Math.PI / 2;
                crossbar.position.set(0, postHeight, -12);
                crossbar.castShadow = true;
                this.scene.add(crossbar);

                // Goal Net (Wireframe Mesh representation)
                const netGeo = new THREE.BoxGeometry(postWidth, postHeight, 2.2);
                const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.25 });
                const net = new THREE.Mesh(netGeo, netMat);
                net.position.set(0, postHeight / 2, -13.1);
                this.scene.add(net);
            }

            buildBall() {
                const ballGeo = new THREE.SphereGeometry(0.11, 32, 32);
                
                // Procedural Canvas Texture for Soccer Ball
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#0f172a';
                // Draw some pentagons/hexagons pattern
                for (let i = 0; i < 10; i++) {
                    ctx.beginPath();
                    ctx.arc(i * 55 + 25, 128, 35, 0, Math.PI * 2);
                    ctx.fill();
                }

                const texture = new THREE.CanvasTexture(canvas);
                const ballMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.4, metalness: 0.1 });
                
                this.ball = new THREE.Mesh(ballGeo, ballMat);
                this.ball.position.copy(this.ballPhysics.pos);
                this.ball.castShadow = true;
                this.scene.add(this.ball);
            }

                // Head

                head.position.y = 1.65;

            initControls() {
                const dom = this.renderer.domElement;

                dom.addEventListener('pointerdown', (e) => {
                    if (this.state !== 'READY') return;
                    this.isDragging = true;
                    this.dragStart = { x: e.clientX, y: e.clientY, time: Date.now() };
                    this.dragPoints = [{ x: e.clientX, y: e.clientY, time: Date.now() }];
                });

                dom.addEventListener('pointermove', (e) => {
                    if (!this.isDragging || this.state !== 'READY') return;
                    this.dragPoints.push({ x: e.clientX, y: e.clientY, time: Date.now() });
                    if (this.dragPoints.length > 10) this.dragPoints.shift();
                });

                dom.addEventListener('pointerup', (e) => {
                    if (!this.isDragging || this.state !== 'READY') return;
                    this.isDragging = false;
                    const dragEnd = { x: e.clientX, y: e.clientY, time: Date.now() };
                    this.handleShoot(this.dragStart, dragEnd, this.dragPoints);
                });
            }

            handleShoot(start, end, points) {
                const dx = end.x - start.x;
                const dy = start.y - end.y; // Swipe up is positive
                const dt = Math.max(1, end.time - start.time);

                // Minimum swipe distance check
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 30 || dy < 10) {
                    // Too weak or downward swipe, ignore
                    return;
                }

                // Hide tutorial
                document.getElementById('tutorial-swipe').classList.add('opacity-0');

                // Calculate shot parameters
                const speedFactor = Math.min(1.8, Math.max(0.6, dist / dt * 1.8));
                const power = (dy / 250) * speedFactor * 16;
                const directionX = (dx / window.innerWidth) * 14;
                const elevation = Math.min(4.5, Math.max(0.5, (dy / 200) * 4.2));

                // Calculate curve / spin based on horizontal path curvature
                let curveX = 0;
                if (points.length >= 3) {
                    const mid = points[Math.floor(points.length / 2)];
                    const expectedX = start.x + (end.x - start.x) * 0.5;
                    curveX = (mid.x - expectedX) * 0.05;
                }

                // Set initial physics velocity
                this.ballPhysics.vel.set(
                    directionX + curveX * 0.3,
                    elevation,
                    -power
                );
                this.ballPhysics.spin.set(0, -curveX * 1.5, 0);
                this.ballPhysics.moving = true;
                this.ballPhysics.hasCollidedPost = false;

                this.audio.playKick();
                this.state = 'SHOOTING';

                // Trigger Goalkeeper AI Reaction
                this.triggerGoalkeeperAI(directionX, elevation);
            }

            triggerGoalkeeperAI(shotX, shotY) {
                // Determine difficulty scaling
                const difficultyBonus = Math.min(0.8, (this.score / 1500));
                
                // Goalkeeper anticipates with some error margin
                const aiTargetX = Math.max(-3.2, Math.min(3.2, shotX * (0.7 + Math.random() * 0.3)));
                const aiTargetY = Math.max(0.4, Math.min(2.2, shotY * (0.6 + Math.random() * 0.4)));

                this.gkAI.targetPos.set(aiTargetX, aiTargetY, -11.8);
                this.gkAI.diving = true;
            }

            startGame(mode) {
                this.mode = mode;
                this.score = 0;
                this.combo = 1;
                this.streak = 0;
                this.lives = 3;
                this.shotsLeft = 5;
                this.timeLeft = 60;

                document.getElementById('screen-menu').classList.add('hidden');
                document.getElementById('screen-pause').classList.add('hidden');
                document.getElementById('screen-gameover').classList.add('hidden');
                document.getElementById('modal-layer').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('screen-hud').classList.remove('hidden');

                this.updateHUDCenter();
                this.audio.playWhistle();
                this.resetBall();
                this.state = 'READY';

                if (mode === 'timeattack') {
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        if (this.state === 'READY' || this.state === 'SHOOTING') {
                            this.timeLeft--;
                            this.updateHUDCenter();
                            if (this.timeLeft <= 0) {
                                clearInterval(this.timerInterval);
                                this.endGame();
                            }
                        }
                    }, 1000);
                }
            }

            updateHUDCenter() {
                const centerElem = document.getElementById('hud-center-status');
                if (this.mode === 'endless') {
                    centerElem.innerHTML = `❤️ <span class="font-bold text-white">${this.lives}</span>`;
                } else if (this.mode === 'classic') {
                    centerElem.innerHTML = `⚽ <span class="font-bold text-white">${this.shotsLeft} Shots</span>`;
                } else if (this.mode === 'timeattack') {
                    centerElem.innerHTML = `⏱️ <span class="font-bold text-neon-yellow">${this.timeLeft}s</span>`;
                }
            }

            pauseGame() {
                if (this.state !== 'READY' && this.state !== 'SHOOTING') return;
                this.state = 'PAUSED';
                document.getElementById('modal-layer').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('screen-pause').classList.remove('hidden');
            }

            resumeGame() {
                document.getElementById('screen-pause').classList.add('hidden');
                document.getElementById('modal-layer').classList.add('opacity-0', 'pointer-events-none');
                this.state = 'READY';
            }

            returnToMenu() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                document.getElementById('screen-pause').classList.add('hidden');
                document.getElementById('screen-gameover').classList.add('hidden');
                document.getElementById('screen-hud').classList.add('hidden');
                document.getElementById('screen-menu').classList.remove('hidden');
                document.getElementById('modal-layer').classList.remove('opacity-0', 'pointer-events-none');
                this.state = 'MENU';
                this.resetBall();
            }

            resetBall() {
                this.ballPhysics.pos.set(0, 0.11, 7);
                this.ballPhysics.vel.set(0, 0, 0);
                this.ballPhysics.spin.set(0, 0, 0);
                this.ballPhysics.moving = false;
                this.ball.position.copy(this.ballPhysics.pos);

                // Reset Goalkeeper
                this.gkAI.pos.set(0, 0.9, -11.8);
                this.gkAI.targetPos.set(0, 0.9, -11.8);
                this.gkAI.diving = false;
                this.goalkeeper.position.copy(this.gkAI.pos);
            }

            showToast(title, subtitle, colorClass = 'text-white') {
                const titleElem = document.getElementById('toast-title');
                const subElem = document.getElementById('toast-subtitle');
                titleElem.textContent = title;
                titleElem.className = `text-4xl md:text-6xl font-black font-arcade ${colorClass} drop-shadow-[0_5px_15px_rgba(0,0,0,0.8)] tracking-wider scale-100 transition-transform duration-300`;
                subElem.textContent = subtitle;
                subElem.style.opacity = '1';

                setTimeout(() => {
                    titleElem.classList.add('scale-0');
                    subElem.style.opacity = '0';
                }, 1400);
            }

            resolveShot(result, points, isTopBin, isCurve, isPost) {
                this.state = 'RESULT';
                let actualPoints = 0;

                if (result === 'GOAL') {
                    this.streak++;
                    // Combo calculation
                    if (this.streak >= 10) this.combo = 3.0;
                    else if (this.streak >= 5) this.combo = 2.0;
                    else if (this.streak >= 3) this.combo = 1.5;
                    else if (this.streak >= 2) this.combo = 1.2;
                    else this.combo = 1.0;

                    actualPoints = Math.round(points * this.combo);
                    this.score += actualPoints;

                    document.getElementById('hud-score').textContent = this.score;
                    if (this.combo > 1) {
                        document.getElementById('hud-combo-badge').classList.remove('hidden');
                        document.getElementById('hud-combo').textContent = this.combo + 'x';
                    }

                    this.audio.playNet();
                    this.audio.playCheer();

                    let toastTitle = 'GOAL!';
                    if (isTopBin) toastTitle = 'TOP BINS!';
                    else if (isPost) toastTitle = 'OFF THE POST!';
                    
                    this.showToast(toastTitle, `+${actualPoints} PTS`, 'text-neon-green');
                } else {
                    this.streak = 0;
                    this.combo = 1;
                    document.getElementById('hud-combo-badge').classList.add('hidden');

                    if (result === 'SAVE') {
                        this.audio.playSave();
                        this.showToast('SAVED!', 'Keeper Blocked!', 'text-electric-400');
                    } else if (result === 'POST') {
                        this.audio.playPostHit();
                        this.showToast('OFF THE POST!', 'Unlucky!', 'text-neon-yellow');
                    } else {
                        this.showToast('MISSED!', 'Wide / Over', 'text-red-400');
                    }

                    // Handle Life / Shot deduction
                    if (this.mode === 'endless') {
                        this.lives--;
                        this.updateHUDCenter();
                        if (this.lives <= 0) {
                            setTimeout(() => this.endGame(), 1500);
                            return;
                        }
                    } else if (this.mode === 'classic') {
                        this.shotsLeft--;
                        this.updateHUDCenter();
                        if (this.shotsLeft <= 0) {
                            setTimeout(() => this.endGame(), 1500);
                            return;
                        }
                    }
                }

                // Record stats & achievements
                const newAchievements = this.storage.recordShot(result === 'GOAL', actualPoints, this.combo, isTopBin, isCurve, isPost);
                newAchievements.forEach(ach => {
                    setTimeout(() => this.showToast('UNLOCKED!', ach, 'text-neon-yellow'), 1600);
                });

                // Next penalty reset delay
                if (!(this.mode === 'endless' && this.lives <= 0) && !(this.mode === 'classic' && this.shotsLeft <= 0)) {
                    setTimeout(() => {
                        this.resetBall();
                        this.state = 'READY';
                    }, 1800);
                }
            }

            endGame() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.state = 'GAMEOVER';

                const isNewRecord = this.storage.updateScore(this.mode, this.score);
                if (isNewRecord) {
                    document.getElementById('go-new-record').classList.remove('hidden');
                } else {
                    document.getElementById('go-new-record').classList.add('hidden');
                }

                document.getElementById('go-score').textContent = this.score;
                document.getElementById('go-goals').textContent = this.storage.data.stats.totalGoals;
                const accuracy = this.storage.data.stats.totalShots > 0 
                    ? Math.round((this.storage.data.stats.totalGoals / this.storage.data.stats.totalShots) * 100) 
                    : 0;
                document.getElementById('go-accuracy').textContent = accuracy + '%';
                document.getElementById('go-combo').textContent = this.storage.data.stats.bestCombo + 'x';

                document.getElementById('screen-hud').classList.add('hidden');
                document.getElementById('screen-gameover').classList.remove('hidden');
                document.getElementById('modal-layer').classList.remove('opacity-0', 'pointer-events-none');
            }

                        <div class="glass-panel p-3 rounded-xl border border-slate-700 text-center">
                            <div class="text-xs text-slate-400">Endless High Score</div>
                            <div class="text-xl font-black font-arcade text-electric-400">${hs.endless}</div>
                        </div>
                        <div class="glass-panel p-3 rounded-xl border border-slate-700 text-center">
                            <div class="text-xs text-slate-400">Classic High Score</div>
                            <div class="text-xl font-black font-arcade text-electric-400">${hs.classic}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="glass-panel p-3 rounded-xl border border-slate-700 text-center">
                            <div class="text-xs text-slate-400">Total Goals</div>
                            <div class="text-lg font-bold text-neon-green">${stats.totalGoals}</div>
                        </div>
                        <div class="glass-panel p-3 rounded-xl border border-slate-700 text-center">
                            <div class="text-xs text-slate-400">Conversion</div>
                            <div class="text-lg font-bold text-white">${accuracy}%</div>
                        </div>
                        <div class="glass-panel p-3 rounded-xl border border-slate-700 text-center">
                            <div class="text-xs text-slate-400">Best Streak</div>
                            <div class="text-lg font-bold text-neon-yellow">${stats.bestStreak}</div>
                        </div>
                    </div>
                `;
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                if (this.state === 'SHOOTING') {
                    // Update ball physics
                    const dt = 0.016;
                    this.ballPhysics.vel.y -= 9.8 * dt * 1.5; // Gravity
                    this.ballPhysics.pos.addScaledVector(this.ballPhysics.vel, dt);

                    // Apply curve/spin aerodynamics (Magnus effect approximation)
                    this.ballPhysics.vel.x += this.ballPhysics.spin.y * dt * 2.0;

                    this.ball.position.copy(this.ballPhysics.pos);
                    this.ball.rotation.x += this.ballPhysics.vel.z * dt;
                    this.ball.rotation.z -= this.ballPhysics.vel.x * dt;

                    // Update Goalkeeper AI dive
                    this.gkAI.pos.lerp(this.gkAI.targetPos, 0.12);
                    this.goalkeeper.position.copy(this.gkAI.pos);

                    // Collision Detections
                    const x = this.ballPhysics.pos.x;
                    const y = this.ballPhysics.pos.y;
                    const z = this.ballPhysics.pos.z;

                    // 1. Goalkeeper Collision Block Check
                    const gkDist = this.ball.position.distanceTo(this.goalkeeper.position);
                    if (gkDist < 0.75 && z <= -11.0 && z >= -12.5) {
                        this.resolveShot('SAVE', 0, false, false, false);
                        return;
                    }

                    // 2. Goalposts & Crossbar Collisions
                    const postRadius = 0.08;
                    const goalWidth = 3.66; // Half-width from center
                    const crossbarHeight = 2.44;

                    // Left/Right Posts
                    if (Math.abs(Math.abs(x) - goalWidth) < 0.15 && y <= crossbarHeight && z <= -11.8 && z >= -12.2) {
                        this.ballPhysics.vel.x *= -0.7;
                        this.ballPhysics.vel.z *= 0.5;
                        this.resolveShot('POST', 175, false, false, true);
                        return;
                    }
                    // Crossbar
                    if (Math.abs(y - crossbarHeight) < 0.15 && Math.abs(x) <= goalWidth && z <= -11.8 && z >= -12.2) {
                        this.ballPhysics.vel.y *= -0.6;
                        this.ballPhysics.vel.z *= 0.5;
                        this.resolveShot('POST', 175, false, false, true);
                        return;
                    }

                    // 3. Goal Line Crossing (Goal Scored!)
                    if (z <= -12.0 && z >= -13.0) {
                        if (Math.abs(x) <= goalWidth && y <= crossbarHeight) {
                            // Check Top Bins (Upper corners)
                            const isTopBin = y >= 1.6 && Math.abs(x) >= 2.2;
                            const isCurve = Math.abs(this.ballPhysics.spin.y) > 0.3;
                            
                            let basePoints = 100;
                            if (isTopBin) basePoints += 150;
                            if (isCurve) basePoints += 50;

                            this.resolveShot('GOAL', basePoints, isTopBin, isCurve, false);
                            return;
                        }
                    }

                    // 4. Missed Shot Check (Out of bounds / too far)
                    if (z < -15.0 || y < 0 || Math.abs(x) > 10.0) {
                        let missType = 'MISS';
                        if (y > crossbarHeight) missType = 'OVER';
                        this.resolveShot(missType, 0, false, false, false);
                        return;
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Initialize game when window loads
        window.onload = () => {
            window.game = new PenaltyKingGame();
        };
    </script>
</body>
</html>
